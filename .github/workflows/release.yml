name: Release

on:
  push:
    tags:
      - 'mechrevo-v*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Railgun-wiki/mechrevo-drivers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release commit belongs to driver branch
        run: |
          git fetch origin mechrevo-v4.22.3
          git merge-base --is-ancestor "$GITHUB_SHA" origin/mechrevo-v4.22.3
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic python3
      - name: Validate and compile
        run: |
          python3 -m unittest discover -s tests -p 'test_fan_validation.py'
          headers="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          test -n "$headers"
          make -C "$headers" M="$GITHUB_WORKSPACE" -j2 modules
      - name: Archive source and checksums
        run: |
          archive="mechrevo-drivers-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar --prefix="mechrevo-drivers-${GITHUB_REF_NAME}/" "$GITHUB_SHA" | gzip -n > "$archive"
          sha256sum "$archive" > SHA256SUMS
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "mechrevo-drivers-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Patched tuxedo-drivers full source. dGPU runtime power-off remains disabled: safe Linux/firmware eject coordination and hardware validation are pending. This archive is source only; no built kernel modules are distributed.'
